name: ci

on:
  push:
    branches: [main, develop, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TITKUL.PMTTCU.slnx

      - name: Build
        run: dotnet build TITKUL.PMTTCU.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test TITKUL.PMTTCU.slnx --no-build --configuration Release

      - name: Secret scan
        run: bash scripts/scan-secrets.sh
